<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HumanZest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;600;700&family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="day-1">

  <!-- ===== APP LAYOUT ===== -->
  <div class="app-layout">

    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ===== LEFT SIDEBAR ===== -->
    <aside class="story-sidebar" id="storySidebar">
      <div class="sidebar-brand">
        <a class="sidebar-logo" href="#" id="sidebarLogo" aria-label="홈으로">
          <span class="logo-brand"><span class="logo-hu">Hu</span><span class="logo-man">man</span><span class="logo-ze">Ze</span><span class="logo-st">st</span></span>
          <span class="logo-sub">매일 떠나는 생각의 기차여행</span>
        </a>
        <button class="sidebar-close" id="sidebarClose" aria-label="닫기">✕</button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav" aria-label="이야기 내비게이션">
        <!-- Rendered by JS -->
      </nav>

      <div class="sidebar-footer-area">
        <div class="sidebar-bottom-img-wrap">
          <img id="sidebarBottomImg" class="sidebar-bottom-img" src="" alt="" />
        </div>
      </div>
    </aside>

    <!-- ===== MAIN WRAPPER ===== -->
    <div class="main-wrapper" id="mainWrapper">

      <!-- Mobile topbar -->
      <div class="topbar" id="topbar">
        <button class="topbar-menu" id="sidebarToggle" aria-label="메뉴 열기">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true">
            <rect width="18" height="2" rx="1" fill="currentColor"/>
            <rect y="6" width="18" height="2" rx="1" fill="currentColor"/>
            <rect y="12" width="18" height="2" rx="1" fill="currentColor"/>
          </svg>
        </button>
        <span class="topbar-brand"><span class="logo-hu">Hu</span><span class="logo-man">man</span><span class="logo-ze">Ze</span><span class="logo-st">st</span></span>
        <span class="topbar-day" id="topbarDay"></span>
      </div>

      <!-- ===== STORY ===== -->
      <main class="story-main" id="storyMain">
        <article class="story-card" id="storyCard">

          <!-- 요일 위치 표시 스트립 -->
          <div class="story-week-strip" id="storyWeekStrip"></div>

          <!-- Story content -->
          <div class="story-content-wrap">

            <!-- 데이트라인 헤더: 날짜(좌) · 카테고리(우) + 구분선 + 제목 -->
            <div class="story-dateline" id="storyDateline">
              <span class="story-dateline-date" id="storyDateLine"></span>
            </div>
            <div class="story-dateline-rule"></div>

            <h2 class="story-title" id="storyTitle"></h2>
            <div class="story-body" id="storyBody"></div>

            <!-- Illustration: inline, after story text -->
            <div class="illustration-area" id="illustrationArea"></div>

            <!-- 섹션 구분 장식 -->
            <div class="story-section-ornament" id="storyOrnament" style="display:none;">···</div>

            <!-- Curator note: personal voice of the curator -->
            <div class="curator-note-section" id="curatorNoteSection"></div>

          </div>

        </article>
      </main>

      <!-- ===== READER STORY SUBMISSION ===== -->
      <section class="submission-section" id="submissionSection">
        <div class="sub-container">

          <div class="sub-compact-bar">
            <span class="sub-compact-title">독자 이야기</span>
            <span class="sub-compact-desc">여러분이 경험한 깨달음, 유머 그리고 감동을 나눠주세요</span>
            <button type="button" class="sub-toggle-btn" id="subBarToggle">보내기 ↓</button>
          </div>

          <div class="sub-expand-area" id="subExpandArea" hidden>
            <form class="sub-form-compact" id="submissionForm" novalidate>

              <div class="sub-inline-row">
                <div class="sub-cat-inline">
                  <button type="button" class="sub-cat-btn" data-cat="통찰">💡 통찰</button>
                  <button type="button" class="sub-cat-btn" data-cat="유머">😄 유머</button>
                  <button type="button" class="sub-cat-btn" data-cat="감동">❤️ 감동</button>
                </div>
                <input type="text" id="subName" class="sub-input sub-input--flex" placeholder="닉네임 *" maxlength="20" autocomplete="nickname" />
              </div>

              <input type="text" id="subTitle" class="sub-input" placeholder="이야기 제목 *" maxlength="60" autocomplete="off" />

              <textarea id="subBody" class="sub-textarea" rows="4" placeholder="이야기 본문 * (50자 이상, 최대 1,000자)" maxlength="1000"></textarea>
              <p class="sub-charcount" id="subBodyCount">0 / 1,000</p>

              <div class="sub-inline-row sub-inline-row--footer">
                <input type="email" id="subEmail" class="sub-input sub-input--flex" placeholder="이메일 (선택)" autocomplete="email" />
                <p class="sub-error" id="subError" aria-live="polite"></p>
                <button type="submit" class="sub-submit-btn" id="subSubmitBtn">제출 →</button>
              </div>

              <!-- JS 호환용 숨김 필드 -->
              <textarea id="subIhe" hidden maxlength="200"></textarea>
              <span id="subIheLabel" hidden></span>
            </form>

            <div class="sub-success" id="subSuccess" hidden>
              <span class="sub-success-icon">🎉</span>
              <span class="sub-success-msg">이야기가 전달되었습니다!</span>
              <button type="button" class="sub-again-btn" id="subAgainBtn">다시 보내기</button>
            </div>
          </div>

        </div>
      </section>

      <!-- ===== SEASON STRIP ===== -->
      <div class="season-strip" id="seasonStrip"></div>

      <!-- ===== FOOTER ===== -->
      <footer class="site-footer">
        <div class="sub-container">
          <p class="footer-logo"><span class="logo-hu">Hu</span><span class="logo-man">man</span><span class="logo-ze">Ze</span><span class="logo-st">st</span></p>
          <p class="footer-copy">매주 월–금 업데이트 · 통찰유머감동 2025</p>
        </div>
      </footer>

    </div><!-- /.main-wrapper -->
  </div><!-- /.app-layout -->

  <script src="js/data.js?v=20260606"></script>
  <script src="js/app.js?v=20260606"></script>
</body>
</html>
